<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Credenciales</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --color-primary: #7c3aed;
            --color-secondary: #ffffff;
            --color-primary-light: #a78bfa;
            --color-primary-dark: #5b21b6;
        }
        
        body {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Fondo decorativo sutil */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .validator-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }
        
        /* Header con logo */
        .validator-header {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeInDown 0.5s ease-out;
        }
        
        .header-logo-container {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto 16px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .header-logo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
        }
        
        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        .header-institute {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            margin-top: 4px;
            letter-spacing: -0.3px;
        }
        
        /* Tarjeta de resultado */
        .result-card {
            background: white;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.06),
                0 2px 8px rgba(0, 0, 0, 0.04);
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .result-card.success {
            border-color: #bbf7d0;
            box-shadow: 
                0 10px 40px rgba(16, 185, 129, 0.1),
                0 2px 8px rgba(16, 185, 129, 0.06);
        }
        
        .result-card.error {
            border-color: #fecaca;
            box-shadow: 
                0 10px 40px rgba(239, 68, 68, 0.08),
                0 2px 8px rgba(239, 68, 68, 0.04);
        }
        
        /* Icono de estado */
        .status-icon-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
        }
        
        .status-icon-container.success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.2);
        }
        
        .status-icon-container.error {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.15);
        }
        
        .status-icon {
            width: 40px;
            height: 40px;
        }
        
        /* Badge de estado */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        
        .status-badge.success {
            background: #f0fdf4;
            color: #059669;
            border: 1px solid #bbf7d0;
        }
        
        .status-badge.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-dot.green {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }
        
        .status-dot.red {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }
        
        /* Información del alumno */
        .info-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
        }
        
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        
        .info-row:first-child {
            padding-top: 0;
        }
        
        .info-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .info-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 2px;
        }
        
        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            word-break: break-word;
        }
        
        /* Timestamp */
        .validation-timestamp {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
        }
        
        .timestamp-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        
        .timestamp-value {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }
        
        /* Footer actions */
        .validator-footer {
            text-align: center;
            margin-top: 24px;
            animation: fadeInUp 0.5s ease-out 0.3s both;
        }
        
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .btn-primary-outline {
            background: white;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }
        
        .btn-primary-outline:hover {
            background: var(--color-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
        }
        
        .powered-by {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 16px;
            letter-spacing: 0.3px;
        }
        
        .powered-by strong {
            color: #94a3b8;
            font-weight: 600;
        }
        
        /* Loader */
        .loader-card {
            background: white;
            border-radius: 24px;
            padding: 48px 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            text-align: center;
            animation: fadeInUp 0.4s ease-out;
        }
        
        .spinner-ring {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 4px solid #f1f5f9;
            border-top-color: var(--color-primary);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        
        .loader-text {
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
        }
        
        .loader-sub {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }
        
        /* Error message card (no ID) */
        .no-id-card {
            background: white;
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }
        
        /* Animaciones */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        
        .shake {
            animation: shake 0.5s ease;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .result-card {
                padding: 24px 20px;
                border-radius: 20px;
            }
            
            .info-section {
                padding: 16px;
            }
            
            .header-logo-container {
                width: 60px;
                height: 60px;
                border-radius: 16px;
            }
            
            .status-icon-container {
                width: 68px;
                height: 68px;
            }
        }
    </style>
</head>
<body>
    <div class="validator-container">
        
        <!-- Header con Logo -->
        <div class="validator-header">
            <div class="header-logo-container">
                <div class="header-logo-placeholder" id="headerLogoPlaceholder">
                    <span>🎓</span>
                </div>
                <img 
                    data-tenant-logo="principal" 
                    src="" 
                    alt="Logo Instituto" 
                    id="headerLogoImg"
                    style="display: none;"
                    onerror="this.style.display='none'; document.getElementById('headerLogoPlaceholder').style.display='flex';"
                    onload="this.style.display='block'; document.getElementById('headerLogoPlaceholder').style.display='none';"
                >
            </div>
            <div class="header-title">Verificación de Credencial</div>
            <div class="header-institute" id="headerInstituteName">Instituto</div>
        </div>
        
        <!-- Contenedor dinámico (loader / resultado / error) -->
        <div id="dynamicContent">
            <!-- Loader inicial -->
            <div class="loader-card" id="loaderCard">
                <div class="spinner-ring"></div>
                <p class="loader-text">Verificando credencial...</p>
                <p class="loader-sub">Consultando registro oficial</p>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="validator-footer">
            <a href="index.html" class="btn-action btn-primary-outline">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>Ir al Portal</span>
            </a>
            <p class="powered-by">
                Validado por <strong>ASARI</strong> &mdash; Sistema de Verificación Oficial
            </p>
        </div>
        
    </div>

    <!-- ============================================ -->
    <!-- CONFIGURACIÓN CENTRAL -->
    <!-- ============================================ -->
    <script src="supabase-config.js?v=3"></script>

    <!-- ============================================ -->
    <!-- LÓGICA DEL VALIDADOR -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // INICIALIZACIÓN DE ICONOS
        // ============================================
        lucide.createIcons();
        
        // ============================================
        // REFERENCIAS AL DOM
        // ============================================
        const dynamicContent = document.getElementById('dynamicContent');
        const headerInstituteName = document.getElementById('headerInstituteName');
        const headerLogoImg = document.getElementById('headerLogoImg');
        const headerLogoPlaceholder = document.getElementById('headerLogoPlaceholder');
        
        // ============================================
        // OBTENER PARÁMETROS DE LA URL
        // ============================================
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                instituto: params.get('instituto'),
                id: params.get('id')
            };
        }
        
        // ============================================
        // FORMATEAR FECHA Y HORA
        // ============================================
        function formatDateTime() {
            const now = new Date();
            
            const opcionesFecha = { 
                day: '2-digit', 
                month: 'long', 
                year: 'numeric' 
            };
            
            const opcionesHora = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            };
            
            const fecha = now.toLocaleDateString('es-AR', opcionesFecha);
            const hora = now.toLocaleTimeString('es-AR', opcionesHora);
            
            return `${fecha} a las ${hora}`;
        }
        
        // ============================================
        // INICIALIZAR TENANT (BRANDING)
        // ============================================
        async function inicializarTenant() {
            try {
                if (typeof window.fetchTenantConfig !== 'function') {
                    console.warn('fetchTenantConfig no disponible, reintentando...');
                    setTimeout(inicializarTenant, 100);
                    return null;
                }
                
                const tenant = await window.fetchTenantConfig();
                
                if (tenant) {
                    const { instituto, configuracion } = tenant;
                    
                    // Actualizar nombre del instituto
                    headerInstituteName.textContent = instituto.nombre;
                    
                    // Actualizar título
                    document.title = `Validador - ${instituto.nombre}`;
                    
                    // Actualizar logo
                    if (configuracion?.branding?.logo_principal) {
                        headerLogoImg.src = configuracion.branding.logo_principal;
                        headerLogoImg.style.display = 'block';
                        headerLogoPlaceholder.style.display = 'none';
                    }
                    
                    console.log('✅ Validador - Tenant cargado:', instituto.nombre);
                    return tenant;
                }
                
                return null;
            } catch (error) {
                console.error('Error inicializando tenant:', error);
                return null;
            }
        }
        
        // ============================================
        // CONSULTAR CREDENCIAL EN SUPABASE
        // ============================================
        async function verificarCredencial(alumnoId) {
            try {
                const { data, error } = await window.supabase
                    .from('padron_global')
                    .select('*')
                    .eq('id', alumnoId)
                    .single();
                
                if (error) {
                    console.error('Error consultando padrón:', error);
                    return { 
                        valido: false, 
                        motivo: 'no_encontrado',
                        error: error.message 
                    };
                }
                
                if (!data) {
                    return { 
                        valido: false, 
                        motivo: 'no_encontrado' 
                    };
                }
                
                if (data.estado_credencial !== 'activo') {
                    return { 
                        valido: false, 
                        motivo: 'suspendido',
                        data: data 
                    };
                }
                
                return { 
                    valido: true, 
                    data: data 
                };
                
            } catch (error) {
                console.error('Error en verificación:', error);
                return { 
                    valido: false, 
                    motivo: 'error',
                    error: error.message 
                };
            }
        }
        
        // ============================================
        // RENDERIZAR UI DE ÉXITO
        // ============================================
        function renderSuccessUI(data) {
            const fechaValidacion = formatDateTime();
            
            dynamicContent.innerHTML = `
                <div class="result-card success">
                    <!-- Icono de éxito -->
                    <div class="status-icon-container success">
                        <i data-lucide="shield-check" class="status-icon" style="color: #059669;"></i>
                    </div>
                    
                    <!-- Badge -->
                    <div style="text-align: center;">
                        <span class="status-badge success">
                            <span class="status-dot green"></span>
                            Credencial Válida
                        </span>
                    </div>
                    
                    <!-- Información del alumno -->
                    <div class="info-section">
                        <div class="info-row">
                            <div class="info-icon" style="background: #ede9fe;">
                                <i data-lucide="user" class="w-4 h-4" style="color: var(--color-primary);"></i>
                            </div>
                            <div>
                                <div class="info-label">Nombre Completo</div>
                                <div class="info-value">${data.nombre_completo || 'No registrado'}</div>
                            </div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-icon" style="background: #dbeafe;">
                                <i data-lucide="credit-card" class="w-4 h-4" style="color: #2563eb;"></i>
                            </div>
                            <div>
                                <div class="info-label">Documento</div>
                                <div class="info-value">${data.documento || 'No registrado'}</div>
                            </div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-icon" style="background: #fef3c7;">
                                <i data-lucide="hash" class="w-4 h-4" style="color: #d97706;"></i>
                            </div>
                            <div>
                                <div class="info-label">Matrícula</div>
                                <div class="info-value">${data.datos_dinamicos?.matricula || 'No asignada'}</div>
                            </div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-icon" style="background: #d1fae5;">
                                <i data-lucide="briefcase" class="w-4 h-4" style="color: #059669;"></i>
                            </div>
                            <div>
                                <div class="info-label">Rol</div>
                                <div class="info-value">${data.rol || 'Alumno Regular'}</div>
                            </div>
                        </div>
                        
                        ${data.email ? `
                        <div class="info-row">
                            <div class="info-icon" style="background: #fce7f3;">
                                <i data-lucide="mail" class="w-4 h-4" style="color: #db2777;"></i>
                            </div>
                            <div>
                                <div class="info-label">Email</div>
                                <div class="info-value" style="font-size: 14px;">${data.email}</div>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                    
                    <!-- Timestamp de validación -->
                    <div class="validation-timestamp">
                        <div class="timestamp-label">
                            <i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>
                            Validado el
                        </div>
                        <div class="timestamp-value">${fechaValidacion}</div>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
        }
        
        // ============================================
        // RENDERIZAR UI DE ERROR
        // ============================================
        function renderErrorUI(motivo, data = null) {
            let titulo = 'Credencial Inválida';
            let mensaje = 'No se pudo verificar la autenticidad de esta credencial.';
            let detalle = '';
            
            switch (motivo) {
                case 'no_encontrado':
                    titulo = 'Credencial No Encontrada';
                    mensaje = 'El identificador proporcionado no corresponde a ningún registro válido en el sistema.';
                    detalle = 'Verifica que el código QR no haya sido alterado.';
                    break;
                case 'suspendido':
                    titulo = 'Credencial Suspendida';
                    mensaje = 'Esta credencial se encuentra suspendida o ha sido revocada por la institución.';
                    if (data?.nombre_completo) {
                        detalle = `Titular: ${data.nombre_completo}`;
                    }
                    break;
                case 'error':
                    titulo = 'Error de Verificación';
                    mensaje = 'Ocurrió un error al consultar el sistema de validación.';
                    detalle = 'Intenta nuevamente en unos momentos.';
                    break;
                default:
                    titulo = 'Credencial No Válida';
                    mensaje = 'No se puede confirmar la validez de esta credencial.';
            }
            
            dynamicContent.innerHTML = `
                <div class="result-card error shake">
                    <!-- Icono de error -->
                    <div class="status-icon-container error">
                        <i data-lucide="shield-alert" class="status-icon" style="color: #dc2626;"></i>
                    </div>
                    
                    <!-- Badge -->
                    <div style="text-align: center;">
                        <span class="status-badge error">
                            <span class="status-dot red"></span>
                            ${titulo}
                        </span>
                    </div>
                    
                    <!-- Mensaje -->
                    <div style="text-align: center; padding: 20px 0;">
                        <p style="font-size: 15px; font-weight: 500; color: #475569; margin-bottom: 8px;">
                            ${mensaje}
                        </p>
                        ${detalle ? `<p style="font-size: 13px; color: #94a3b8;">${detalle}</p>` : ''}
                    </div>
                    
                    <!-- Separador -->
                    <div style="border-top: 1px solid #f1f5f9; padding-top: 16px; text-align: center;">
                        <p style="font-size: 12px; color: #cbd5e1;">
                            <i data-lucide="info" class="w-3 h-3 inline mr-1"></i>
                            Si consideras que esto es un error, contacta a la institución.
                        </p>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
        }
        
        // ============================================
        // RENDERIZAR UI SIN ID
        // ============================================
        function renderNoIdUI() {
            dynamicContent.innerHTML = `
                <div class="no-id-card">
                    <div style="
                        width: 72px;
                        height: 72px;
                        border-radius: 50%;
                        background: #f1f5f9;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        margin: 0 auto 20px;
                    ">
                        <i data-lucide="scan" style="width: 36px; height: 36px; color: #94a3b8;"></i>
                    </div>
                    <p style="font-size: 16px; font-weight: 600; color: #64748b; margin-bottom: 8px;">
                        Sin credencial para validar
                    </p>
                    <p style="font-size: 13px; color: #94a3b8; line-height: 1.5;">
                        Escanea un código QR válido para verificar una credencial.<br>
                        El enlace debe incluir un identificador de alumno.
                    </p>
                </div>
            `;
            
            lucide.createIcons();
        }
        
        // ============================================
        // FLUJO PRINCIPAL
        // ============================================
        async function inicializar() {
            console.log('✅ Inicializando Validador ASARI...');
            
            // 1. Inicializar tenant (branding)
            await inicializarTenant();
            
            // 2. Obtener parámetros de URL
            const { id } = getUrlParams();
            
            // 3. Validar que haya ID
            if (!id) {
                console.warn('⚠️ No se proporcionó ID de alumno');
                renderNoIdUI();
                return;
            }
            
            console.log('🔍 Verificando credencial ID:', id);
            
            // 4. Consultar Supabase
            const resultado = await verificarCredencial(id);
            
            // 5. Pequeña pausa para mostrar el loader (UX)
            await new Promise(resolve => setTimeout(resolve, 800));
            
            // 6. Renderizar según resultado
            if (resultado.valido) {
                console.log('✅ Credencial VÁLIDA:', resultado.data.nombre_completo);
                renderSuccessUI(resultado.data);
            } else {
                console.warn('❌ Credencial INVÁLIDA:', resultado.motivo);
                renderErrorUI(resultado.motivo, resultado.data);
            }
        }
        
        // ============================================
        // EVENTOS DEL DOM
        // ============================================
        window.addEventListener('DOMContentLoaded', inicializar);
        
        // Refrescar iconos si hay cambios
        window.addEventListener('load', () => {
            lucide.createIcons();
        });
        
        console.log('✅ Validador ASARI - Listo');
    </script>
</body>
</html>
