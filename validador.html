<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Credenciales</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        :root {
            --color-primary: #7c3aed;
            --color-secondary: #ffffff;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .validator-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }
        
        .status-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .status-suspended {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .status-expired {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .pulse-green {
            animation: pulseGreen 2s infinite;
        }
        
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .animate-slide-down {
            animation: slideDown 0.5s ease-out;
        }
        
        .info-row {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .verified-badge {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="p-4">
    <div class="validator-card animate-slide-down">
        <!-- Header Status -->
        <div id="statusHeader" class="status-active px-8 py-12 text-center text-white relative">
            <div class="verified-badge">
                <i data-lucide="shield-check" class="w-4 h-4 inline mr-1"></i>
                VERIFICADO
            </div>
            <div class="w-20 h-20 mx-auto bg-white/20 rounded-full flex items-center justify-center mb-4 pulse-green">
                <i data-lucide="check-circle" class="w-12 h-12 text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold mb-2" id="estadoCredencial">ACTIVO</h1>
            <p class="text-white/80 text-sm" id="fechaVerificacion">
                Verificado: <span id="fechaActual"></span>
            </p>
        </div>
        
        <!-- Credential Details -->
        <div class="px-8 py-8">
            <div class="text-center mb-6">
                <img 
                    data-tenant-logo="principal" 
                    src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><rect width='60' height='60' rx='12' fill='%237c3aed'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='30'>🎓</text></svg>"
                    alt="Logo" 
                    class="w-16 h-16 mx-auto rounded-xl mb-3"
                >
                <h2 class="text-xl font-bold text-gray-900" id="institutoNombre">Instituto</h2>
                <p class="text-sm text-gray-500">Institución Avalante</p>
            </div>
            
            <!-- Student Information -->
            <div class="space-y-4">
                <div class="info-row">
                    <p class="text-xs text-gray-500 mb-1" data-termino="alumno">Alumno</p>
                    <p class="text-lg font-semibold text-gray-900" id="nombreAlumno">Nombre del Estudiante</p>
                </div>
                
                <div class="info-row">
                    <p class="text-xs text-gray-500 mb-1" data-termino="matricula">Nº de Registro</p>
                    <p class="text-lg font-semibold text-gray-900" id="numeroMatricula">000000</p>
                </div>
                
                <div class="info-row">
                    <p class="text-xs text-gray-500 mb-1">Documento</p>
                    <p class="text-lg font-semibold text-gray-900" id="documentoAlumno">00.000.000</p>
                </div>
                
                <div class="info-row">
                    <p class="text-xs text-gray-500 mb-1">Rol</p>
                    <p class="text-lg font-semibold text-gray-900" id="rolAlumno">Estudiante Regular</p>
                </div>
                
                <div class="info-row">
                    <p class="text-xs text-gray-500 mb-1">Fecha de Emisión</p>
                    <p class="text-lg font-semibold text-gray-900">01/03/2024</p>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="mt-8 space-y-3">
                <button onclick="window.location.href='index.html'" class="w-full py-3 px-6 rounded-xl font-semibold text-white transition" style="background: var(--color-primary);">
                    <i data-lucide="home" class="w-5 h-5 inline mr-2"></i>
                    Ir al Portal
                </button>
                <button onclick="window.print()" class="w-full py-3 px-6 rounded-xl font-semibold border-2 transition" style="border-color: var(--color-primary); color: var(--color-primary);">
                    <i data-lucide="printer" class="w-5 h-5 inline mr-2"></i>
                    Imprimir Verificación
                </button>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="px-8 pb-6 text-center">
            <p class="text-xs text-gray-400">
                Verificación realizada por el sistema ASARI
                <br>
                Esta credencial es verificable y única
            </p>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // Inicializar iconos
        lucide.createIcons();
        
        // Establecer fecha actual
        document.getElementById('fechaActual').textContent = new Date().toLocaleString('es-AR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        
        // Cargar datos de la credencial y tenant
        async function inicializarValidador() {
            try {
                // Obtener parámetros del QR (simulado)
                const urlParams = new URLSearchParams(window.location.search);
                const credencialId = urlParams.get('id') || 'demo-123';
                
                const tenant = await fetchTenantConfig();
                
                if (tenant) {
                    const { instituto, configuracion } = tenant;
                    
                    // Actualizar UI
                    document.getElementById('institutoNombre').textContent = instituto.nombre;
                    document.title = `Validador - ${instituto.nombre}`;
                    
                    // Datos de demostración del estudiante
                    const datosDemo = {
                        nombre: 'María García',
                        matricula: '2024-00123',
                        documento: '12.345.678',
                        rol: configuracion.terminologia?.alumno || 'Alumno',
                        estado: 'activo'
                    };
                    
                    // Intentar obtener datos reales si hay un ID de credencial
                    if (credencialId !== 'demo-123') {
                        const { data: padron, error } = await supabase
                            .from('padron_global')
                            .select('*')
                            .eq('id', credencialId)
                            .single();
                        
                        if (padron && !error) {
                            datosDemo.nombre = padron.nombre_completo || datosDemo.nombre;
                            datosDemo.matricula = padron.datos_dinamicos?.matricula || datosDemo.matricula;
                            datosDemo.documento = padron.documento || datosDemo.documento;
                            datosDemo.rol = padron.rol || datosDemo.rol;
                            datosDemo.estado = padron.estado_credencial || 'activo';
                        }
                    }
                    
                    // Actualizar UI con datos del estudiante
                    document.getElementById('nombreAlumno').textContent = datosDemo.nombre;
                    document.getElementById('numeroMatricula').textContent = datosDemo.matricula;
                    document.getElementById('documentoAlumno').textContent = datosDemo.documento;
                    document.getElementById('rolAlumno').textContent = datosDemo.rol;
                    
                    // Actualizar estado visual
                    actualizarEstadoVisual(datosDemo.estado);
                    
                    // Aplicar terminología
                    document.querySelectorAll('[data-termino]').forEach(el => {
                        const key = el.getAttribute('data-termino');
                        if (configuracion.terminologia[key]) {
                            el.textContent = configuracion.terminologia[key];
                        }
                    });
                }
            } catch (error) {
                console.error('Error inicializando validador:', error);
                document.getElementById('estadoCredencial').textContent = 'ERROR';
                document.getElementById('estadoCredencial').className = 'text-3xl font-extrabold mb-2 text-red-400';
            }
        }
        
        function actualizarEstadoVisual(estado) {
            const header = document.getElementById('statusHeader');
            const estadoElement = document.getElementById('estadoCredencial');
            
            // Remover clases anteriores
            header.classList.remove('status-active', 'status-suspended', 'status-expired');
            
            switch (estado) {
                case 'activo':
                    header.classList.add('status-active');
                    estadoElement.textContent = 'ACTIVO';
                    estadoElement.className = 'text-3xl font-extrabold mb-2 text-white';
                    break;
                case 'suspendido':
                    header.classList.add('status-suspended');
                    estadoElement.textContent = 'SUSPENDIDO';
                    estadoElement.className = 'text-3xl font-extrabold mb-2 text-white';
                    // Cambiar icono
                    const icon = header.querySelector('[data-lucide]');
                    if (icon) {
                        icon.setAttribute('data-lucide', 'x-circle');
                    }
                    break;
                case 'expirado':
                    header.classList.add('status-expired');
                    estadoElement.textContent = 'EXPIRADO';
                    estadoElement.className = 'text-3xl font-extrabold mb-2 text-white';
                    break;
                default:
                    header.classList.add('status-suspended');
                    estadoElement.textContent = 'NO VÁLIDO';
            }
            
            lucide.createIcons();
        }
        
        // Inicializar
        window.addEventListener('DOMContentLoaded', inicializarValidador);
    </script>
</body>
</html>
