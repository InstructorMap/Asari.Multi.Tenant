<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal & CMS - Panel Director | ASARI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        :root {
            --color-primary: #7c3aed;
            --color-primary-light: #a78bfa;
            --color-primary-dark: #5b21b6;
        }
        
        body { background: #050509; color: #e2e8f0; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        
        .app-layout { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px; background: rgba(10,10,20,0.95); border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0;
            z-index: 40; transition: transform 0.3s ease; backdrop-filter: blur(20px);
        }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-logo-box { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .sidebar-logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-logo-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary)); }
        .sidebar-institute-name { font-size: 14px; font-weight: 700; color: white; line-height: 1.2; }
        .sidebar-institute-role { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: #94a3b8; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; margin-bottom: 2px; text-decoration: none; }
        .nav-item:hover { background: rgba(255,255,255,0.04); color: #e2e8f0; }
        .nav-item.active { background: rgba(124,58,237,0.15); color: #a78bfa; font-weight: 600; }
        
        .sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-logout { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; background: none; border: none; color: #ef4444; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-logout:hover { background: rgba(239,68,68,0.1); }
        
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 39; backdrop-filter: blur(2px); }
        .sidebar-overlay.active { display: block; }
        
        .main-content { flex: 1; margin-left: 260px; min-height: 100vh; transition: margin-left 0.3s ease; }
        
        .topbar { background: rgba(5,5,9,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
        .btn-hamburger { display: none; width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); cursor: pointer; align-items: center; justify-content: center; color: #94a3b8; }
        
        .page-title { font-size: 20px; font-weight: 700; color: white; }
        .page-subtitle { font-size: 13px; color: #64748b; margin-top: 2px; }
        
        .btn-primary { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; border: 1px solid rgba(139,92,246,0.3); padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease; white-space: nowrap; }
        .btn-primary:hover { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 0 20px rgba(139,92,246,0.3); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        
        .content-area { padding: 24px 28px; }
        
        .card-dios { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; transition: all 0.2s ease; }
        .card-dios:hover { border-color: rgba(139,92,246,0.2); }
        
        .table-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; overflow: hidden; }
        .table-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .table-title { font-size: 16px; font-weight: 700; color: white; }
        .table-wrapper { overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; padding: 12px 24px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
        tbody td { padding: 14px 24px; font-size: 14px; color: #cbd5e1; border-bottom: 1px solid rgba(255,255,255,0.03); }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        
        .news-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;
            padding: 20px; transition: all 0.2s ease; cursor: pointer;
        }
        .news-card:hover { border-color: rgba(139,92,246,0.3); transform: translateY(-2px); }
        .news-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
        
        .btn-icon-sm { width: 34px; height: 34px; border-radius: 8px; background: none; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #94a3b8; transition: all 0.15s ease; }
        .btn-icon-sm:hover { background: rgba(255,255,255,0.05); color: white; }
        .btn-icon-sm.danger:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: #fca5a5; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.hidden { display: none; }
        .modal-card { background: #0f0f1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 60px rgba(0,0,0,0.5); animation: modalIn 0.25s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 18px; font-weight: 700; color: white; }
        .modal-close { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
        .modal-close:hover { background: rgba(255,255,255,0.1); color: white; }
        .modal-body { padding: 24px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 10px; justify-content: flex-end; }
        
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 14px; color: white; outline: none; transition: all 0.15s ease; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: rgba(139,92,246,0.5); box-shadow: 0 0 15px rgba(139,92,246,0.1); background: rgba(255,255,255,0.06); }
        .form-input::placeholder, .form-textarea::placeholder { color: #475569; }
        .form-textarea { resize: vertical; min-height: 100px; }
        select.form-select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 10px center; background-repeat: no-repeat; background-size: 20px; padding-right: 40px; }
        select.form-select option { background: #1a1a2e; color: white; }
        
        .file-drop-zone {
            border: 2px dashed rgba(255,255,255,0.15); border-radius: 14px; padding: 28px 20px;
            text-align: center; cursor: pointer; transition: all 0.2s ease; background: rgba(255,255,255,0.02); position: relative;
        }
        .file-drop-zone:hover { border-color: var(--color-primary-light); background: rgba(124,58,237,0.05); }
        .file-drop-zone.has-file { border-color: #10b981; background: rgba(16,185,129,0.05); }
        .file-drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .file-drop-zone .preview-img { max-width: 100%; max-height: 140px; border-radius: 8px; margin-top: 12px; display: none; }
        .file-drop-zone.has-file .preview-img { display: block; }
        
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 200; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: toastIn 0.3s ease-out; max-width: 400px; }
        .toast.success { background: #059669; color: white; }
        .toast.error { background: #dc2626; color: white; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } .btn-hamburger { display: flex; } }
        @media (max-width: 640px) { .content-area { padding: 16px; } .topbar { padding: 12px 16px; } }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    
    <!-- SIDEBAR UNIFICADO -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="flex items-center gap-3">
                <div class="sidebar-logo-box">
                    <div class="sidebar-logo-placeholder" id="sidebarLogoPlaceholder"><span>🎓</span></div>
                    <img data-tenant-logo="principal" src="" alt="Logo" id="sidebarLogoImg" style="display: none;"
                        onerror="this.style.display='none';document.getElementById('sidebarLogoPlaceholder').style.display='flex';"
                        onload="this.style.display='block';document.getElementById('sidebarLogoPlaceholder').style.display='none';">
                </div>
                <div>
                    <div class="sidebar-institute-name" id="sidebarInstituteName">Instituto</div>
                    <div class="sidebar-institute-role">Panel Director</div>
                </div>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>Dashboard</span></a>
            <a href="staff.html" class="nav-item"><i data-lucide="shield" class="w-4 h-4"></i><span>Staff & Permisos</span></a>
            <a href="crm.html" class="nav-item"><i data-lucide="users" class="w-4 h-4"></i><span>Alumnos</span></a>
            <a href="sedes.html" class="nav-item"><i data-lucide="map-pin" class="w-4 h-4"></i><span>Sedes y Cobros</span></a>
            <a href="campus-admin.html" class="nav-item"><i data-lucide="graduation-cap" class="w-4 h-4"></i><span>Campus Virtual</span></a>
            <a href="certificados.html" class="nav-item"><i data-lucide="award" class="w-4 h-4"></i><span>Certificaciones</span></a>
            <a href="portal-admin.html" class="nav-item active"><i data-lucide="globe" class="w-4 h-4"></i><span>Portal & CMS</span></a>
            <a href="reportes.html" class="nav-item"><i data-lucide="file-text" class="w-4 h-4"></i><span>Reportes</span></a>
            <a href="configuracion.html" class="nav-item"><i data-lucide="settings" class="w-4 h-4"></i><span>Configuración</span></a>
        </nav>
        
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="handleLogout()"><i data-lucide="log-out" class="w-5 h-5"></i><span>Cerrar Sesión</span></button>
        </div>
    </aside>
    
    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="topbar">
            <div class="flex items-center gap-4">
                <button class="btn-hamburger" onclick="toggleSidebar()"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <div>
                    <h1 class="page-title">Portal & CMS</h1>
                    <p class="page-subtitle" id="tenantSubtitle">Publica noticias y seminarios en tu web</p>
                </div>
            </div>
            <button class="btn-primary" onclick="abrirModalPublicacion()"><i data-lucide="plus" class="w-5 h-5"></i> Nueva Publicación</button>
        </header>
        
        <div class="content-area">
            
            <!-- PUBLICACIONES -->
            <div class="table-card">
                <div class="table-header"><h2 class="table-title">Publicaciones del Portal</h2></div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Imagen</th><th>Título</th><th>Tipo</th><th>Fecha</th><th>Acciones</th></tr></thead>
                        <tbody id="publicacionesTableBody"></tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </main>
    
    <!-- MODAL NUEVA/EDITAR PUBLICACIÓN -->
    <div class="modal-overlay hidden" id="publicacionModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="publicacionModalTitle">Nueva Publicación</h3>
                <button class="modal-close" onclick="cerrarModalPublicacion()"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="publicacionForm">
                <div class="modal-body">
                    <input type="hidden" id="publicacionId">
                    <div class="form-group"><label class="form-label">Título *</label><input type="text" id="pubTitulo" class="form-input" placeholder="Ej: Nuevo Seminario de IA 2026" required></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-group"><label class="form-label">Tipo *</label><select id="pubTipo" class="form-select"><option value="Noticia">Noticia</option><option value="Seminario">Seminario</option><option value="Evento">Evento</option></select></div>
                        <div class="form-group"><label class="form-label">Estado</label><select id="pubEstado" class="form-select"><option value="publicado">Publicado</option><option value="borrador">Borrador</option></select></div>
                    </div>
                    <div class="form-group"><label class="form-label">Descripción *</label><textarea id="pubDescripcion" class="form-textarea" placeholder="Escribe el contenido de la publicación..." required></textarea></div>
                    <div class="form-group">
                        <label class="form-label">Imagen de Portada</label>
                        <div class="file-drop-zone" id="dropPortada">
                            <input type="file" accept="image/*" onchange="handleFileDrop(this, 'portada')">
                            <i data-lucide="image" class="w-8 h-8 text-gray-500 mx-auto mb-2"></i>
                            <p class="text-sm text-gray-400">Click para subir imagen</p>
                            <img src="" class="preview-img" id="previewPortada">
                            <p class="text-xs text-green-500 mt-1 hidden" id="fileNamePortada"></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="cerrarModalPublicacion()">Cancelar</button>
                    <button type="submit" class="btn-primary" id="pubSubmitBtn"><i data-lucide="save" class="w-4 h-4"></i> Guardar Publicación</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>

    <script src="supabase-config.js?v=5"></script>

    <script>
        lucide.createIcons();
        
        let tenantConfig = null;
        let publicacionesData = [];
        let archivoPortada = null;
        const STORAGE_BUCKET = 'asari-assets';
        
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlayEl = document.getElementById('sidebarOverlay');
        const toast = document.getElementById('toast');
        
        function toggleSidebar() { sidebar.classList.toggle('open'); sidebarOverlayEl.classList.toggle('active'); }
        function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlayEl.classList.remove('active'); }
        
        function showToast(msg, type = 'success') {
            toast.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5"></i><span>${msg}</span>`;
            toast.className = `toast ${type}`; lucide.createIcons();
            clearTimeout(window._tt); window._tt = setTimeout(() => { toast.className = 'toast hidden'; toast.innerHTML = ''; }, 4000);
        }
        
        async function checkAuth() {
            const { data: { session } } = await window.supabase.auth.getSession();
            if (!session?.user) { const slug = window.getTenantSlug ? window.getTenantSlug() : 'default'; window.location.href = `login.html?instituto=${encodeURIComponent(slug)}`; return false; }
            return true;
        }
        async function handleLogout() {
            if (!confirm('¿Cerrar sesión?')) return;
            await window.supabase.auth.signOut();
            localStorage.removeItem('asari_user_session');
            const slug = window.getTenantSlug ? window.getTenantSlug() : 'default';
            window.location.href = `login.html?instituto=${encodeURIComponent(slug)}`;
        }
        
        async function inicializarTenant() {
            if (typeof window.fetchTenantConfig !== 'function') { setTimeout(inicializarTenant, 100); return; }
            tenantConfig = await window.fetchTenantConfig();
            if (tenantConfig) {
                const { instituto, configuracion } = tenantConfig;
                document.getElementById('sidebarInstituteName').textContent = instituto.nombre;
                document.getElementById('tenantSubtitle').textContent = `CMS - ${instituto.nombre}`;
                document.title = `Portal CMS - ${instituto.nombre} | ASARI`;
                if (configuracion?.branding?.logo_principal) {
                    document.getElementById('sidebarLogoImg').src = configuracion.branding.logo_principal;
                    document.getElementById('sidebarLogoImg').style.display = 'block';
                    document.getElementById('sidebarLogoPlaceholder').style.display = 'none';
                }
                window.__TENANT_CONFIG__ = tenantConfig;
            }
        }
        
        // ============ CARGAR PUBLICACIONES ============
        async function cargarPublicaciones() {
            const institutoId = tenantConfig?.instituto?.id;
            if (!institutoId) return;
            const tbody = document.getElementById('publicacionesTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8"><div class="spinner"></div></td></tr>';
            
            try {
                const { data, error } = await window.supabase.from('cms_publicaciones').select('*').eq('instituto_id', institutoId).order('created_at', { ascending: false });
                if (error) throw error;
                publicacionesData = data || [];
                
                if (publicacionesData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">No hay publicaciones</td></tr>';
                } else {
                    tbody.innerHTML = publicacionesData.map(p => `
                        <tr>
                            <td>${p.imagen_url ? `<img src="${p.imagen_url}" class="w-12 h-12 rounded-lg object-cover">` : '<div class="w-12 h-12 rounded-lg bg-white/5 flex items-center justify-center"><i data-lucide="image" class="w-5 h-5 text-gray-600"></i></div>'}</td>
                            <td><span class="font-semibold text-white">${p.titulo}</span></td>
                            <td><span class="text-xs px-2 py-1 rounded-full bg-blue-500/15 text-blue-400">${p.tipo}</span></td>
                            <td class="text-sm text-gray-400">${new Date(p.created_at).toLocaleDateString('es-AR')}</td>
                            <td><div class="flex gap-2">
                                <button class="btn-icon-sm" onclick="editarPublicacion('${p.id}')"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                <button class="btn-icon-sm danger" onclick="eliminarPublicacion('${p.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div></td>
                        </tr>
                    `).join('');
                }
                lucide.createIcons();
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-red-400">Error al cargar</td></tr>';
            }
        }
        
        // ============ MANEJO DE ARCHIVOS ============
        function handleFileDrop(input, tipo) {
            if (input.files && input.files[0]) {
                archivoPortada = input.files[0];
                const dropZone = document.getElementById('dropPortada');
                const preview = document.getElementById('previewPortada');
                const fileName = document.getElementById('fileNamePortada');
                
                dropZone.classList.add('has-file');
                fileName.textContent = input.files[0].name;
                fileName.classList.remove('hidden');
                
                const reader = new FileReader();
                reader.onload = (e) => { preview.src = e.target.result; preview.style.display = 'block'; };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        async function uploadPortada(file) {
            const institutoId = tenantConfig.instituto.id;
            const ext = file.name.split('.').pop();
            const path = `cms/${institutoId}/portada_${Date.now()}.${ext}`;
            const { error } = await window.supabase.storage.from(STORAGE_BUCKET).upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type });
            if (error) throw error;
            const { data } = window.supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
            return data.publicUrl;
        }
        
        // ============ MODAL PUBLICACIÓN ============
        function resetearDropZone() {
            archivoPortada = null;
            const dropZone = document.getElementById('dropPortada');
            dropZone.classList.remove('has-file');
            document.getElementById('previewPortada').style.display = 'none';
            document.getElementById('fileNamePortada').classList.add('hidden');
        }
        
        function abrirModalPublicacion() {
            document.getElementById('publicacionForm').reset();
            document.getElementById('publicacionId').value = '';
            document.getElementById('publicacionModalTitle').textContent = 'Nueva Publicación';
            resetearDropZone();
            document.getElementById('publicacionModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function cerrarModalPublicacion() { document.getElementById('publicacionModal').classList.add('hidden'); }
        
        function editarPublicacion(id) {
            const pub = publicacionesData.find(p => p.id === id);
            if (!pub) return;
            document.getElementById('publicacionId').value = pub.id;
            document.getElementById('pubTitulo').value = pub.titulo || '';
            document.getElementById('pubTipo').value = pub.tipo || 'Noticia';
            document.getElementById('pubEstado').value = pub.estado || 'publicado';
            document.getElementById('pubDescripcion').value = pub.descripcion || '';
            document.getElementById('publicacionModalTitle').textContent = 'Editar Publicación';
            resetearDropZone();
            document.getElementById('publicacionModal').classList.remove('hidden');
            lucide.createIcons();
        }
        
        document.getElementById('publicacionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const institutoId = tenantConfig?.instituto?.id;
            if (!institutoId) { showToast('Error: Instituto no identificado', 'error'); return; }
            
            const id = document.getElementById('publicacionId').value;
            const titulo = document.getElementById('pubTitulo').value.trim();
            const tipo = document.getElementById('pubTipo').value;
            const estado = document.getElementById('pubEstado').value;
            const descripcion = document.getElementById('pubDescripcion').value.trim();
            
            if (!titulo || !descripcion) { showToast('Título y Descripción son obligatorios', 'error'); return; }
            
            const btn = document.getElementById('pubSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner w-5 h-5"></div><span>Guardando...</span>';
            
            try {
                let imagenUrl = id ? (publicacionesData.find(p => p.id === id)?.imagen_url || null) : null;
                if (archivoPortada) { imagenUrl = await uploadPortada(archivoPortada); }
                
                const pubData = { instituto_id: institutoId, titulo, tipo, estado, descripcion, imagen_url: imagenUrl };
                let result;
                if (id) { result = await window.supabase.from('cms_publicaciones').update(pubData).eq('id', id); }
                else { result = await window.supabase.from('cms_publicaciones').insert([pubData]); }
                if (result.error) throw result.error;
                
                cerrarModalPublicacion();
                await cargarPublicaciones();
                showToast(id ? 'Publicación actualizada' : 'Publicación creada exitosamente');
            } catch(err) {
                showToast('Error: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Guardar Publicación';
                lucide.createIcons();
            }
        });
        
        async function eliminarPublicacion(id) {
            const pub = publicacionesData.find(p => p.id === id);
            if (!pub || !confirm(`¿Eliminar "${pub.titulo}"?`)) return;
            const { error } = await window.supabase.from('cms_publicaciones').delete().eq('id', id);
            if (error) { showToast('Error al eliminar', 'error'); return; }
            await cargarPublicaciones();
            showToast('Publicación eliminada');
        }
        
        async function inicializar() {
            if (!await checkAuth()) return;
            await inicializarTenant();
            await cargarPublicaciones();
        }
        
        window.addEventListener('DOMContentLoaded', inicializar);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarModalPublicacion(); });
        document.getElementById('publicacionModal').addEventListener('click', function(e) { if (e.target === this) cerrarModalPublicacion(); });
        document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', () => { if (window.innerWidth < 1024) closeSidebar(); }));
    </script>
</body>
</html>
