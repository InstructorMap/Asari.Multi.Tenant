<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Campus Virtual - Plataforma Educativa</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --color-primary: #7c3aed;
            --color-secondary: #ffffff;
            --color-primary-light: #a78bfa;
            --color-primary-dark: #5b21b6;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        body {
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(99, 102, 241, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        
        .app-header {
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        
        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .header-logo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
        }
        
        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        
        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .app-content {
            flex: 1;
            padding: 20px;
            padding-bottom: calc(100px + var(--safe-area-bottom));
            overflow-y: auto;
        }
        
        .greeting h1 {
            font-size: 24px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        
        .greeting p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 4px;
        }
        
        .progress-section {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .progress-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .progress-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--color-primary-light);
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
            border-radius: 10px;
            transition: width 0.6s ease;
        }
        
        .video-section {
            margin-top: 24px;
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
            padding-left: 4px;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 8px;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .video-title {
            font-size: 15px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }
        
        .video-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .modules-section {
            margin-top: 24px;
        }
        
        .module-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .module-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }
        
        .module-item.active {
            background: rgba(124, 58, 237, 0.15);
            border-color: var(--color-primary);
        }
        
        .module-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .module-icon-box.completed {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .module-icon-box.pending {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
        }
        
        .module-icon-box.current {
            background: rgba(124, 58, 237, 0.3);
            color: #a78bfa;
        }
        
        .module-info {
            flex: 1;
            min-width: 0;
        }
        
        .module-name {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 2px;
        }
        
        .module-duration {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .module-status {
            flex-shrink: 0;
        }
        
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 20px;
            padding-bottom: calc(8px + var(--safe-area-bottom));
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 20;
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            position: relative;
        }
        
        .tab-item.active {
            color: var(--color-primary-light);
        }
        
        .tab-item.active::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--color-primary);
        }
        
        .tab-item span {
            font-size: 10px;
            font-weight: 600;
        }
        
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            animation: toastIn 0.3s ease-out;
            white-space: nowrap;
            max-width: 90vw;
            text-align: center;
        }
        
        .toast.success {
            background: #059669;
            color: white;
        }
        
        .toast.info {
            background: #2563eb;
            color: white;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        @keyframes toastOut {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }
        
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        
        .loader-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (min-width: 481px) {
            .app-container {
                border-left: 1px solid rgba(255, 255, 255, 0.05);
                border-right: 1px solid rgba(255, 255, 255, 0.05);
            }
        }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loader">
        <div class="loader-spinner"></div>
    </div>
    
    <div class="app-container">
        
        <header class="app-header">
            <div class="header-logo" id="headerLogoContainer">
                <div class="header-logo-placeholder" id="headerLogoPlaceholder">
                    <span>🎓</span>
                </div>
                <img 
                    data-tenant-logo="principal" 
                    src="" 
                    alt="Logo" 
                    id="headerLogoImg"
                    style="display: none;"
                    onerror="this.style.display='none'; document.getElementById('headerLogoPlaceholder').style.display='flex';"
                    onload="this.style.display='block'; document.getElementById('headerLogoPlaceholder').style.display='none';"
                >
            </div>
            
            <div>
                <span class="text-sm font-semibold text-white" id="headerInstituteName">Instituto</span>
            </div>
            
            <a href="wallet.html" class="btn-icon" title="Volver a la Billetera">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
        </header>
        
        <main class="app-content">
            
            <div class="greeting">
                <h1>Bienvenido al campus, <span id="studentName">Estudiante</span> 👋</h1>
                <p>Continúa tu aprendizaje donde lo dejaste</p>
            </div>
            
            <div class="progress-section">
                <div class="progress-header">
                    <span class="progress-label">Progreso del curso</span>
                    <span class="progress-value" id="progressPercentage">45%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 45%;"></div>
                </div>
            </div>
            
            <div class="video-section">
                <p class="section-title">Clase actual</p>
                
                <div class="video-container">
                    <iframe 
                        id="mainVideo"
                        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                        title="Video de la clase"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
                
                <h3 class="video-title" id="currentVideoTitle">1.1 Introducción al Curso</h3>
                <p class="video-subtitle" id="currentVideoSubtitle">Duración: 12:30 • Módulo 1</p>
            </div>
            
            <div class="modules-section">
                <p class="section-title">Módulos del curso</p>
                
                <div id="modulesList">
                    <!-- Renderizado dinámico -->
                </div>
            </div>
            
        </main>
        
        <nav class="tab-bar">
            <a href="wallet.html" class="tab-item">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span>Billetera</span>
            </a>
            <a href="#" class="tab-item active">
                <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                <span>Campus</span>
            </a>
            <a href="wallet.html" class="tab-item" onclick="sessionStorage.setItem('openQR','true')">
                <i data-lucide="qr-code" class="w-5 h-5"></i>
                <span>Mi QR</span>
            </a>
            <a href="#" class="tab-item" onclick="showToast('Perfil disponible próximamente', 'info')">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span>Perfil</span>
            </a>
        </nav>
        
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="supabase-config.js?v=3"></script>

    <script>
        lucide.createIcons();
        
        const loader = document.getElementById('loader');
        const studentName = document.getElementById('studentName');
        const headerLogoImg = document.getElementById('headerLogoImg');
        const headerLogoPlaceholder = document.getElementById('headerLogoPlaceholder');
        const headerInstituteName = document.getElementById('headerInstituteName');
        const progressPercentage = document.getElementById('progressPercentage');
        const progressFill = document.getElementById('progressFill');
        const mainVideo = document.getElementById('mainVideo');
        const currentVideoTitle = document.getElementById('currentVideoTitle');
        const currentVideoSubtitle = document.getElementById('currentVideoSubtitle');
        const modulesList = document.getElementById('modulesList');
        const toast = document.getElementById('toast');
        
        // ============================================
        // DATOS MOCKEADOS DE MÓDULOS Y CLASES
        // ============================================
        const courseModules = [
            {
                id: 1,
                name: 'Módulo 1: Fundamentos',
                classes: [
                    { id: 1, title: '1.1 Introducción al Curso', duration: '12:30', videoId: 'dQw4w9WgXcQ', completed: true },
                    { id: 2, title: '1.2 Conceptos Básicos', duration: '18:45', videoId: 'dQw4w9WgXcQ', completed: true },
                    { id: 3, title: '1.3 Primeros Pasos', duration: '15:20', videoId: 'dQw4w9WgXcQ', completed: false }
                ]
            },
            {
                id: 2,
                name: 'Módulo 2: Práctica Intermedia',
                classes: [
                    { id: 4, title: '2.1 Herramientas Avanzadas', duration: '22:10', videoId: 'dQw4w9WgXcQ', completed: false },
                    { id: 5, title: '2.2 Ejercicios Guiados', duration: '30:00', videoId: 'dQw4w9WgXcQ', completed: false },
                    { id: 6, title: '2.3 Proyecto Parcial', duration: '25:45', videoId: 'dQw4w9WgXcQ', completed: false }
                ]
            },
            {
                id: 3,
                name: 'Módulo 3: Evaluación Final',
                classes: [
                    { id: 7, title: '3.1 Repaso General', duration: '20:00', videoId: 'dQw4w9WgXcQ', completed: false },
                    { id: 8, title: '3.2 Examen Final', duration: '45:00', videoId: 'dQw4w9WgXcQ', completed: false }
                ]
            }
        ];
        
        let currentClassId = 1;
        let completedClasses = [1, 2]; // IDs de clases completadas
        
        // ============================================
        // VERIFICACIÓN DE SESIÓN
        // ============================================
        async function checkAuth() {
            try {
                const { data: { session }, error } = await window.supabase.auth.getSession();
                
                if (error || !session?.user) {
                    redirectToLogin();
                    return false;
                }
                
                console.log('✅ Sesión verificada:', session.user.email);
                
                window.__CURRENT_USER__ = {
                    id: session.user.id,
                    email: session.user.email
                };
                
                return true;
            } catch (error) {
                console.error('Error verificando sesión:', error);
                redirectToLogin();
                return false;
            }
        }
        
        function redirectToLogin() {
            const tenantSlug = window.getTenantSlug ? window.getTenantSlug() : 'default';
            window.location.href = `login.html?instituto=${encodeURIComponent(tenantSlug)}`;
        }
        
        // ============================================
        // INICIALIZACIÓN DEL TENANT
        // ============================================
        async function inicializarTenant() {
            try {
                if (typeof window.fetchTenantConfig !== 'function') {
                    setTimeout(inicializarTenant, 100);
                    return null;
                }
                
                const tenant = await window.fetchTenantConfig();
                
                if (tenant) {
                    const { instituto, configuracion } = tenant;
                    
                    headerInstituteName.textContent = instituto.nombre;
                    document.title = `Campus Virtual - ${instituto.nombre}`;
                    
                    if (configuracion?.branding?.logo_principal) {
                        headerLogoImg.src = configuracion.branding.logo_principal;
                        headerLogoImg.style.display = 'block';
                        headerLogoPlaceholder.style.display = 'none';
                    } else {
                        headerLogoImg.style.display = 'none';
                        headerLogoPlaceholder.style.display = 'flex';
                        headerLogoPlaceholder.style.background = 
                            `linear-gradient(135deg, var(--color-primary-light), var(--color-primary))`;
                    }
                    
                    window.__TENANT_CONFIG__ = tenant;
                    
                    console.log('✅ Campus inicializado para:', instituto.nombre);
                    return tenant;
                }
                
                return null;
            } catch (error) {
                console.error('Error inicializando tenant:', error);
                return null;
            }
        }
        
        // ============================================
        // CARGAR NOMBRE DEL ESTUDIANTE
        // ============================================
        async function cargarNombreEstudiante() {
            try {
                const userEmail = window.__CURRENT_USER__?.email;
                const tenantConfig = window.__TENANT_CONFIG__;
                const institutoId = tenantConfig?.instituto?.id;
                
                if (!userEmail || !institutoId) return;
                
                const { data, error } = await window.supabase
                    .from('padron_global')
                    .select('nombre_completo')
                    .eq('email', userEmail)
                    .eq('instituto_id', institutoId)
                    .maybeSingle();
                    
                if (error) throw error;
                
                if (data?.nombre_completo) {
                    const nombrePila = data.nombre_completo.split(' ')[0];
                    studentName.textContent = nombrePila;
                }
            } catch (error) {
                console.warn('No se pudo cargar el nombre del estudiante:', error.message);
            }
        }
        
        // ============================================
        // RENDERIZAR LISTA DE MÓDULOS
        // ============================================
        function renderModules() {
            modulesList.innerHTML = courseModules.map(module => {
                const moduleClasses = module.classes.map(cls => {
                    const isActive = cls.id === currentClassId;
                    const isCompleted = completedClasses.includes(cls.id);
                    
                    let iconClass = 'pending';
                    let iconName = 'play';
                    
                    if (isCompleted) {
                        iconClass = 'completed';
                        iconName = 'check-circle';
                    } else if (isActive) {
                        iconClass = 'current';
                        iconName = 'play';
                    }
                    
                    return `
                        <div class="module-item ${isActive ? 'active' : ''}" onclick="selectClass(${cls.id})">
                            <div class="module-icon-box ${iconClass}">
                                <i data-lucide="${iconName}" class="w-5 h-5"></i>
                            </div>
                            <div class="module-info">
                                <p class="module-name">${cls.title}</p>
                                <p class="module-duration">${cls.duration}</p>
                            </div>
                            <div class="module-status">
                                ${isCompleted 
                                    ? '<i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>'
                                    : (isActive 
                                        ? '<span style="font-size: 10px; background: rgba(124,58,237,0.3); color: #a78bfa; padding: 4px 10px; border-radius: 10px; font-weight: 600;">AHORA</span>'
                                        : '<i data-lucide="lock" class="w-4 h-4 text-gray-600"></i>')
                                }
                            </div>
                        </div>
                    `;
                }).join('');
                
                return `
                    <div style="margin-bottom: 16px;">
                        <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.3); margin-bottom: 8px; padding-left: 4px;">
                            ${module.name}
                        </p>
                        ${moduleClasses}
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }
        
        // ============================================
        // SELECCIONAR CLASE
        // ============================================
        function selectClass(classId) {
            currentClassId = classId;
            
            // Buscar la clase en los datos mockeados
            let selectedClass = null;
            let moduleIndex = 0;
            
            for (const module of courseModules) {
                const found = module.classes.find(c => c.id === classId);
                if (found) {
                    selectedClass = found;
                    break;
                }
                moduleIndex++;
            }
            
            if (!selectedClass) return;
            
            // Actualizar video
            mainVideo.src = `https://www.youtube.com/embed/${selectedClass.videoId}`;
            currentVideoTitle.textContent = selectedClass.title;
            currentVideoSubtitle.textContent = `Duración: ${selectedClass.duration} • Módulo ${moduleIndex + 1}`;
            
            // Marcar como completada si no lo estaba
            if (!completedClasses.includes(classId)) {
                completedClasses.push(classId);
                updateProgress();
            }
            
            // Re-renderizar lista para actualizar estados visuales
            renderModules();
            
            // Scroll suave al video
            document.querySelector('.video-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            showToast(`Reproduciendo: ${selectedClass.title}`, 'info');
        }
        
        // ============================================
        // ACTUALIZAR PROGRESO
        // ============================================
        function updateProgress() {
            const totalClasses = courseModules.reduce((sum, m) => sum + m.classes.length, 0);
            const completedCount = completedClasses.length;
            const percentage = Math.round((completedCount / totalClasses) * 100);
            
            progressPercentage.textContent = `${percentage}%`;
            progressFill.style.width = `${percentage}%`;
            
            // Cambiar color si está completo
            if (percentage === 100) {
                progressFill.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
                showToast('🎉 ¡Curso completado! Felicitaciones', 'success');
            }
        }
        
        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.animation = 'none';
            toast.offsetHeight;
            toast.style.animation = 'toastIn 0.3s ease-out';
            
            clearTimeout(window._toastTimeout);
            window._toastTimeout = setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease forwards';
                setTimeout(() => {
                    toast.className = 'toast hidden';
                    toast.style.animation = '';
                }, 300);
            }, 2500);
        }
        
        // ============================================
        // INICIALIZACIÓN PRINCIPAL
        // ============================================
        async function inicializar() {
            console.log('📚 Inicializando Campus Virtual...');
            
            const isAuthenticated = await checkAuth();
            if (!isAuthenticated) return;
            
            await inicializarTenant();
            await cargarNombreEstudiante();
            
            renderModules();
            updateProgress();
            
            setTimeout(() => {
                loader.classList.add('hidden');
            }, 300);
            
            console.log('✅ Campus Virtual inicializado correctamente');
        }
        
        window.addEventListener('DOMContentLoaded', inicializar);
        
        window.addEventListener('load', () => {
            lucide.createIcons();
        });
        
        window.addEventListener('popstate', () => {
            history.pushState(null, '', window.location.href);
        });
        
        history.pushState(null, '', window.location.href);
        
        console.log('📚 Campus ASARI - Listo');
    </script>
</body>
</html>
