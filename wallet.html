<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7c3aed">
    <title data-termino="wallet">Billetera Digital</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        
        :root {
            --color-primary: #7c3aed;
            --color-secondary: #ffffff;
            --color-primary-light: #a78bfa;
            --color-primary-dark: #5b21b6;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        body {
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        .phone-frame {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        @media (min-width: 401px) {
            .phone-frame {
                border-radius: 30px;
                min-height: 90vh;
                max-height: 95vh;
                margin: 20px;
            }
        }
        
        .credential-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin: 20px;
            transition: transform 0.3s ease;
        }
        
        .credential-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .credential-card::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        
        .qr-container {
            background: white;
            border-radius: 16px;
            padding: 16px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .tab-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-bottom: var(--safe-area-bottom);
            margin-top: auto;
        }
        
        .tab-item {
            transition: all 0.2s ease;
            position: relative;
        }
        
        .tab-item.active {
            color: var(--color-primary);
        }
        
        .tab-item.active::after {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--color-primary);
        }
        
        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Header -->
        <div class="px-5 pt-12 pb-6">
            <div class="flex items-center justify-between">
                <button onclick="history.back()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5 text-white"></i>
                </button>
                <h1 class="text-white font-bold text-lg" data-termino="wallet">Billetera Digital</h1>
                <button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                    <i data-lucide="more-vertical" class="w-5 h-5 text-white"></i>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 px-5 space-y-6">
            <!-- Credential Card -->
            <div class="credential-card animate-slide-up">
                <div class="relative z-10">
                    <!-- Institute Logo & Name -->
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center space-x-3">
                            <img data-tenant-logo="principal" src="" alt="Logo" class="w-12 h-12 rounded-lg bg-white/20" onerror="this.style.display='none'">
                            <div>
                                <p class="text-white/80 text-xs" id="institutoLabel">Instituto</p>
                                <p class="text-white font-bold text-sm" id="institutoNombre">Cargando...</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="pulse-dot"></div>
                            <span class="text-white text-xs font-medium">ACTIVO</span>
                        </div>
                    </div>
                    
                    <!-- Student Info -->
                    <div class="mb-6">
                        <h2 class="text-white text-2xl font-bold" id="nombreAlumno">Estudiante</h2>
                        <p class="text-white/70 text-sm mt-1" id="rolAlumno">Rol del estudiante</p>
                    </div>
                    
                    <!-- Dynamic Data -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <p class="text-white/60 text-xs" data-termino="matricula">Nº de Registro</p>
                            <p class="text-white font-semibold" id="numeroMatricula">000000</p>
                        </div>
                        <div>
                            <p class="text-white/60 text-xs">Documento</p>
                            <p class="text-white font-semibold" id="documentoAlumno">00.000.000</p>
                        </div>
                        <div class="col-span-2">
                            <p class="text-white/60 text-xs">Válido hasta</p>
                            <p class="text-white font-semibold">31/12/2026</p>
                        </div>
                    </div>
                    
                    <!-- QR Code -->
                    <div class="text-center">
                        <div class="qr-container inline-block mb-3">
                            <i data-lucide="qr-code" class="w-32 h-32 text-gray-900"></i>
                        </div>
                        <p class="text-white/60 text-xs">Mostrar este código para validar</p>
                    </div>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="grid grid-cols-2 gap-4 animate-slide-up" style="animation-delay: 0.2s;">
                <a href="campus.html" class="bg-white/20 backdrop-blur-lg rounded-2xl p-6 text-center hover:bg-white/30 transition border border-white/20">
                    <i data-lucide="graduation-cap" class="w-8 h-8 text-white mx-auto mb-2"></i>
                    <span class="text-white font-medium text-sm">Campus Virtual</span>
                </a>
                
                <a href="#" class="bg-white/20 backdrop-blur-lg rounded-2xl p-6 text-center hover:bg-white/30 transition border border-white/20">
                    <i data-lucide="book-open" class="w-8 h-8 text-white mx-auto mb-2"></i>
                    <span class="text-white font-medium text-sm">Biblioteca</span>
                </a>
            </div>
            
            <!-- Recent Activity -->
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 animate-slide-up" style="animation-delay: 0.3s;">
                <h3 class="text-white font-semibold mb-4">Actividad Reciente</h3>
                <div class="space-y-3">
                    <div class="flex items-center space-x-3 text-white/80">
                        <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center">
                            <i data-lucide="check" class="w-4 h-4 text-green-400"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-medium text-white">Credencial verificada</p>
                            <p class="text-xs text-white/60">Hace 2 horas</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 text-white/80">
                        <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center">
                            <i data-lucide="book-open" class="w-4 h-4 text-blue-400"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-medium text-white">Acceso al campus</p>
                            <p class="text-xs text-white/60">Ayer</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Tab Bar -->
        <div class="tab-bar px-6 py-3 mt-6">
            <div class="flex justify-between items-center">
                <button class="tab-item active flex flex-col items-center space-y-1">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Billetera</span>
                </button>
                <button class="tab-item flex flex-col items-center space-y-1 text-gray-400" onclick="window.location.href='campus.html'">
                    <i data-lucide="play-circle" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Campus</span>
                </button>
                <button class="tab-item flex flex-col items-center space-y-1 text-gray-400">
                    <i data-lucide="user" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Perfil</span>
                </button>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // Inicializar iconos
        lucide.createIcons();
        
        // Cargar datos del estudiante y configuración del tenant
        async function inicializarWallet() {
            try {
                const slug = getTenantSlug();
                const tenant = await fetchTenantConfig();
                
                if (tenant) {
                    const { instituto, configuracion } = tenant;
                    
                    // Actualizar UI con datos del instituto
                    document.getElementById('institutoNombre').textContent = instituto.nombre;
                    document.getElementById('institutoLabel').textContent = instituto.slug_dominio;
                    document.title = `${configuracion.terminologia?.wallet || 'Billetera'} - ${instituto.nombre}`;
                    
                    // Cargar datos del estudiante (simulado)
                    // En producción, esto vendría de padron_global con auth.uid()
                    const datosDemo = {
                        nombre: 'María García',
                        rol: configuracion.terminologia?.alumno || 'Alumno',
                        matricula: '2024-00123',
                        documento: '12.345.678'
                    };
                    
                    document.getElementById('nombreAlumno').textContent = datosDemo.nombre;
                    document.getElementById('rolAlumno').textContent = datosDemo.rol;
                    document.getElementById('numeroMatricula').textContent = datosDemo.matricula;
                    document.getElementById('documentoAlumno').textContent = datosDemo.documento;
                    
                    // Aplicar terminología
                    document.querySelectorAll('[data-termino]').forEach(el => {
                        const key = el.getAttribute('data-termino');
                        if (configuracion.terminologia[key]) {
                            el.textContent = configuracion.terminologia[key];
                        }
                    });
                    
                    // Aplicar color primario al theme-color
                    if (configuracion.branding?.colores?.primario) {
                        document.querySelector('meta[name="theme-color"]')
                            .setAttribute('content', configuracion.branding.colores.primario);
                    }
                }
            } catch (error) {
                console.error('Error inicializando wallet:', error);
            }
        }
        
        // Prevenir scroll no deseado en iOS
        document.body.addEventListener('touchmove', function(e) {
            if (e.target === document.body) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Inicializar
        window.addEventListener('DOMContentLoaded', inicializarWallet);
    </script>
    
    <!-- Registrar Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('✅ SW registrado en wallet');
                    })
                    .catch(error => {
                        console.log('Error SW:', error);
                    });
            });
        }
    </script>
</body>
</html>
